<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8' />
    <title>MapLibre Terrain Test</title>
    <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
    <script src='https://unpkg.com/maplibre-gl@4.1.3/dist/maplibre-gl.js'></script>
    <link href='https://unpkg.com/maplibre-gl@4.1.3/dist/maplibre-gl.css' rel='stylesheet' />
    <style>
        body { margin: 0; padding: 0; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        #btn { position: absolute; top: 10px; left: 10px; z-index: 1000; padding: 10px; }
    </style>
</head>
<body>
<div id='map'></div>
<button id="btn">Fly to Kathmandu</button>
<script>
    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://demotiles.maplibre.org/style.json',
        center: [10, 50],
        zoom: 4,
        pitch: 0
    });

    map.on('load', () => {
        map.addSource('terrain', {
            type: 'raster-dem',
            url: 'https://demotiles.maplibre.org/terrain-tiles/tiles.json',
            tileSize: 256
        });
        map.setTerrain({ source: 'terrain', exaggeration: 1 });

        document.getElementById('btn').onclick = () => {
            // Kathmandu: lon: 85.3240, lat: 27.7172
            // Ground elevation is around 1300m
            map.flyTo({
                center: [85.3240, 27.7172],
                zoom: 14,
                pitch: 60,
                bearing: 0
            });

            // At the end of the flight, enforce the correct elevation
            map.once('moveend', () => {
                map.jumpTo({
                    center: [85.3240, 27.7172],
                    zoom: 14,
                    pitch: 60,
                    bearing: 0,
                    elevation: 1300
                });
            });
        };
    });
</script>
</body>
</html>
